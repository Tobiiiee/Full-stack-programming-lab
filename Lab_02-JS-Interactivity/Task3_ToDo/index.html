<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 3 - To-Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>📝 To-Do List</h1>

      <div id="task-list">
        <div class="task" id="task-1">
          <input type="text" value="Buy groceries" readonly />
          <button class="btn-done" onclick="markDone('task-1')">Done</button>
          <button class="btn-remove" onclick="removeTask('task-1')">
            Remove
          </button>
        </div>
        <div class="task" id="task-2">
          <input type="text" value="Read a book" readonly />
          <button class="btn-done" onclick="markDone('task-2')">Done</button>
          <button class="btn-remove" onclick="removeTask('task-2')">
            Remove
          </button>
        </div>
        <div class="task" id="task-3">
          <input type="text" value="Exercise for 30 minutes" readonly />
          <button class="btn-done" onclick="markDone('task-3')">Done</button>
          <button class="btn-remove" onclick="removeTask('task-3')">
            Remove
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
