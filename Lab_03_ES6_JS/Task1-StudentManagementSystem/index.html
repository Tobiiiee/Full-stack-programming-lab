<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management System</title>
  </head>
  <body>
    <h1>Student Management System</h1>
    <div id="studentList"></div>

    <script>
      class Student {
        constructor(id, name, semester, courses) {
          this.id = id;
          this.name = name;
          this.semester = semester;
          this.courses = courses;
        }
      }

      const student1 = new Student(1, "Ali Ahmed", 5, [
        "Web Development",
        "Database",
        "Software Engineering",
      ]);
      const student2 = new Student(2, "Sara Khan", 3, [
        "Data Structures",
        "OOP",
        "Discrete Math",
      ]);
      const student3 = new Student(3, "Hassan Raza", 7, [
        "Machine Learning",
        "AI",
        "Computer Vision",
      ]);

      const students = [student1, student2, student3];

      let output = "";
      for (let student of students) {
        output += `
                <div style="border: 1px solid #ccc; padding: 15px; margin: 10px 0;">
                    <h3>Student ID: ${student.id}</h3>
                    <p><strong>Name:</strong> ${student.name}</p>
                    <p><strong>Semester:</strong> ${student.semester}</p>
                    <p><strong>Courses:</strong> ${student.courses.join(", ")}</p>
                </div>
            `;
      }

      document.getElementById("studentList").innerHTML = output;
    </script>
  </body>
</html>
